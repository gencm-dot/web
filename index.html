<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Toko</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"
            integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK"
            crossorigin="anonymous"></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        body.modal-open { overflow: hidden; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        .skeleton { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; background-color: #e5e7eb; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800 font-sans">

    <div id="error-page" class="hidden fixed inset-0 bg-white z-50 flex flex-col items-center justify-center p-6 text-center">
        <h1 class="text-6xl font-bold text-gray-300 mb-4" id="error-code">404</h1>
        <h2 class="text-2xl font-bold text-gray-700 mb-2" id="error-title">Halaman Tidak Ditemukan</h2>
        <p class="text-gray-500 mb-6" id="error-desc">Toko tidak ditemukan atau sedang tidak aktif.</p>
        <button onclick="window.location.reload()" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-semibold">Muat Ulang</button>
    </div>

    <header class="bg-white shadow-sm sticky top-0 z-10">
        <div class="max-w-md mx-auto px-4 py-4 flex justify-between items-center">
            <h1 id="store-name" class="text-xl font-bold text-blue-600">Memuat Toko...</h1>
            <div class="relative">
                <span class="text-2xl">🛒</span>
                <span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-bold px-2 py-0.5 rounded-full hidden">0</span>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 pb-24">
        <div id="loading" class="space-y-4">
            <div class="h-20 rounded-xl skeleton"></div>
            <div class="h-20 rounded-xl skeleton"></div>
            <div class="h-20 rounded-xl skeleton"></div>
        </div>
        <div id="error-msg" class="hidden bg-red-100 text-red-700 p-4 rounded-lg mb-4 text-center"></div>
        <div id="product-list" class="grid grid-cols-1 gap-3 hidden"></div>
    </main>

    <div id="floating-cart" class="fixed bottom-0 left-0 right-0 p-4 bg-white border-t border-gray-200 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] transform translate-y-full transition-transform duration-300 z-20">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <p class="text-sm text-gray-500">Total Belanja</p>
                <p id="cart-total" class="text-xl font-bold text-gray-900">Rp 0</p>
            </div>
            <button onclick="openCheckout()" class="bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-700 transition shadow-md">
                Pesan Sekarang
            </button>
        </div>
    </div>

    <div id="checkout-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-end justify-center">
        <div class="bg-white w-full max-w-md rounded-t-2xl p-6 transform transition-transform duration-300 translate-y-full max-h-[90vh] overflow-y-auto" id="modal-content">
            <h2 class="text-xl font-bold mb-4 text-gray-800">Konfirmasi Pesanan</h2>

            <p class="text-sm font-semibold mb-3 text-gray-700">Pilih Tipe Pesanan:</p>
            <div class="flex gap-3 mb-4">
                <label class="flex-1 flex items-center justify-center p-3 border border-gray-300 rounded-lg cursor-pointer hover:bg-blue-50 transition has-[:checked]:border-blue-600 has-[:checked]:bg-blue-50">
                    <input type="radio" name="order_type" value="pickup" class="mr-2 accent-blue-600" checked>
                    <span class="text-sm font-medium">Ambil Sendiri</span>
                </label>
                <label class="flex-1 flex items-center justify-center p-3 border border-gray-300 rounded-lg cursor-pointer hover:bg-blue-50 transition has-[:checked]:border-blue-600 has-[:checked]:bg-blue-50">
                    <input type="radio" name="order_type" value="delivery" class="mr-2 accent-blue-600">
                    <span class="text-sm font-medium">Antar / Deliv</span>
                </label>
            </div>

            <label class="block text-sm font-semibold mb-1 text-gray-700" for="order-note">Catatan (Opsional):</label>
            <textarea id="order-note" rows="2" maxlength="300" class="w-full border border-gray-300 rounded-lg p-2 mb-4 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Contoh: Tanpa es, pedas sedang..."></textarea>

            <p class="text-sm font-semibold mb-3 text-gray-700">Pilih Metode Pembayaran:</p>
            <div class="flex gap-3 mb-6">
                <label class="flex-1 flex items-center justify-center p-3 border border-gray-300 rounded-lg cursor-pointer hover:bg-blue-50 transition has-[:checked]:border-blue-600 has-[:checked]:bg-blue-50">
                    <input type="radio" name="payment" value="tunai" class="mr-2 accent-blue-600" checked>
                    <span class="text-sm font-medium">Tunai</span>
                </label>
                <label class="flex-1 flex items-center justify-center p-3 border border-gray-300 rounded-lg cursor-pointer hover:bg-blue-50 transition has-[:checked]:border-blue-600 has-[:checked]:bg-blue-50">
                    <input type="radio" name="payment" value="qris" class="mr-2 accent-blue-600">
                    <span class="text-sm font-medium">QRIS</span>
                </label>
            </div>

            <div id="qris-section" class="hidden mb-4 text-center">
                <p class="text-xs text-gray-500 mb-1">Scan QRIS di bawah ini:</p>
                <img id="qris-image" src="" alt="QRIS" class="mx-auto w-40 h-40 object-contain border rounded-lg shadow-sm">
            </div>

            <div class="cf-turnstile mb-4 flex justify-center" data-sitekey="0x4AAAAAAFtgRHOwM3ep1Ln9" data-callback="onTurnstileSuccess" data-expired-callback="onTurnstileExpired"></div>

            <div class="flex gap-3">
                <button onclick="closeCheckout()" class="flex-1 bg-gray-100 text-gray-700 py-3 rounded-lg font-semibold hover:bg-gray-200 transition">Batal</button>
                <button id="btn-submit" onclick="submitOrder()" class="flex-1 bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700 transition shadow-md disabled:bg-gray-400 disabled:cursor-not-allowed" disabled>Kirim ke Kasir</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://zvpbdbzcvahtowpxjraw.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp2cGJkYnpjdmFodG93cHhqcmF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwODA2NzQsImV4cCI6MjEwODY1NjY3NH0.wfxhfAboj0CC2_eayH-SvKhMLUjWIrrfZM89x1KpC3k';
        const CREATE_ORDER_URL = SUPABASE_URL + '/functions/v1/create-order';
        const IMAGE_BASE = SUPABASE_URL + '/storage/v1/object/public/product-images/';
        const IMAGE_PATH_REGEX = /^STORE-[A-Z0-9]{8,12}\/[A-Za-z0-9._-]{1,100}\.(webp|jpg|jpeg|png)$/i;

        const urlParams = new URLSearchParams(window.location.search);
        const rawStoreId = urlParams.get('store') || '';
        const STORE_ID = /^STORE-[A-Z0-9]{8,12}$/i.test(rawStoreId) ? rawStoreId.toUpperCase() : '';

        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: { persistSession: false, autoRefreshToken: false }
        });

        let products = [];
        let cart = {};
        let storeQrisUrl = '';
        let turnstileToken = '';

        function escapeHTML(str) {
            return String(str).replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag]));
        }

        function formatRupiah(n) {
            return 'Rp ' + Number(n).toLocaleString('id-ID');
        }

        window.onTurnstileSuccess = function (token) {
            turnstileToken = token;
            document.getElementById('btn-submit').disabled = false;
        };

        window.onTurnstileExpired = function () {
            turnstileToken = '';
            document.getElementById('btn-submit').disabled = true;
        };

        function showErrorPage(code, title, desc) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('error-code').innerText = code;
            document.getElementById('error-title').innerText = title;
            document.getElementById('error-desc').textContent = desc;
            document.getElementById('error-page').classList.remove('hidden');
            document.getElementById('product-list').style.display = 'none';
            document.getElementById('floating-cart').style.display = 'none';
        }

        function handleOrderTypeChange() {
            const orderType = document.querySelector('input[name="order_type"]:checked').value;
            const noteInput = document.getElementById('order-note');
            if (orderType === 'delivery') {
                noteInput.focus();
                noteInput.placeholder = 'Wajib: tulis alamat lengkap pengantaran di sini...';
                if (!noteInput.dataset.alerted) {
                    alert('Anda memilih Antar/Deliv. Silakan tulis alamat lengkap Anda di kolom Catatan.');
                    noteInput.dataset.alerted = 'true';
                }
            } else {
                noteInput.placeholder = 'Contoh: Tanpa es, pedas sedang...';
            }
        }

        document.querySelectorAll('input[name="order_type"]').forEach(r =>
            r.addEventListener('change', handleOrderTypeChange));

        async function fetchStoreInfo() {
            const { data, error } = await db
                .from('profiles')
                .select('store_name, qris_url')
                .eq('store_id', STORE_ID)
                .maybeSingle();

            if (error || !data) {
                showErrorPage('404', 'Toko Tidak Ditemukan', 'Toko tidak ditemukan atau sedang tidak aktif.');
                throw new Error('store not found');
            }

            document.getElementById('store-name').innerText = data.store_name;
            document.title = data.store_name + ' - Menu';

            // Terima URL https, atau data URI gambar (app menyimpan QRIS sebagai base64 di qris_url).
            if (data.qris_url && /^(https:\/\/|data:image\/(png|jpe?g|webp);base64,[A-Za-z0-9+\/=]+$)/i.test(data.qris_url)) {
                storeQrisUrl = data.qris_url;
                document.getElementById('qris-image').src = storeQrisUrl;
            }
        }

        async function fetchProducts() {
            const { data, error } = await db
                .from('products')
                .select('id, name, price, stock, category, image_path')
                .eq('store_id', STORE_ID)
                .gt('stock', 0);

            if (error) throw error;

            products = data || [];
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('product-list').classList.remove('hidden');
            renderProducts();
        }

        function renderProducts() {
            const container = document.getElementById('product-list');
            container.innerHTML = '';

            if (products.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-500 py-10">Belum ada produk tersedia saat ini.</p>';
                return;
            }

            products.forEach(p => {
                const qty = cart[p.id] ? cart[p.id].qty : 0;

                // Kartu vertikal: gambar di atas, teks di bawah
                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col';

                // Gambar produk di atas teks kategori
                if (p.image_path && IMAGE_PATH_REGEX.test(p.image_path)) {
                    const imgWrap = document.createElement('div');
                    imgWrap.className = 'w-full h-40 bg-gray-100 overflow-hidden';
                    const img = document.createElement('img');
                    img.src = IMAGE_BASE + encodeURI(p.image_path);
                    img.alt = p.name;
                    img.loading = 'lazy';
                    img.className = 'w-full h-full object-cover';
                    img.onerror = () => imgWrap.remove();
                    imgWrap.appendChild(img);
                    card.appendChild(imgWrap);
                }

                const body = document.createElement('div');
                body.className = 'p-4 flex flex-col';

                const info = document.createElement('div');
                info.innerHTML = `
                    <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">${escapeHTML(p.category)}</span>
                    <h3 class="font-bold text-lg text-gray-800 break-words">${escapeHTML(p.name)}</h3>
                    <p class="text-blue-600 font-semibold mb-1">${formatRupiah(p.price)}</p>
                    <p class="text-xs text-gray-500">Sisa Stok: ${escapeHTML(p.stock)}</p>
                `;
                body.appendChild(info);

                const controls = document.createElement('div');
                controls.className = 'flex items-center gap-3 mt-3 justify-end';

                if (qty > 0) {
                    const minus = document.createElement('button');
                    minus.className = 'w-8 h-8 rounded-full bg-red-50 text-red-600 font-bold border border-red-100 flex items-center justify-center hover:bg-red-100 transition';
                    minus.textContent = '-';
                    minus.onclick = () => updateQty(p.id, -1);
                    controls.appendChild(minus);

                    const count = document.createElement('span');
                    count.className = 'font-bold w-4 text-center';
                    count.textContent = qty;
                    controls.appendChild(count);
                }

                const plus = document.createElement('button');
                plus.className = 'w-8 h-8 rounded-full bg-blue-50 text-blue-600 font-bold border border-blue-100 flex items-center justify-center hover:bg-blue-100 transition';
                plus.textContent = '+';
                plus.onclick = () => updateQty(p.id, 1);
                controls.appendChild(plus);

                body.appendChild(controls);
                card.appendChild(body);
                container.appendChild(card);
            });
        }

        function updateQty(productId, change) {
            const product = products.find(p => p.id === productId);
            if (!product) return;

            if (!cart[productId]) cart[productId] = { qty: 0, data: product };

            const newQty = cart[productId].qty + change;
            if (newQty < 0) return;
            if (newQty > product.stock) {
                alert('Maaf, stok tidak mencukupi.');
                return;
            }

            if (newQty === 0) delete cart[productId];
            else cart[productId].qty = newQty;

            renderProducts();
            updateCartUI();
        }

        function updateCartUI() {
            let total = 0, totalItems = 0;
            for (const key in cart) {
                total += cart[key].data.price * cart[key].qty;
                totalItems += cart[key].qty;
            }

            const countBadge = document.getElementById('cart-count');
            const floatingCart = document.getElementById('floating-cart');

            if (totalItems > 0) {
                countBadge.classList.remove('hidden');
                countBadge.innerText = totalItems;
                floatingCart.classList.remove('translate-y-full');
            } else {
                countBadge.classList.add('hidden');
                floatingCart.classList.add('translate-y-full');
            }
            document.getElementById('cart-total').innerText = formatRupiah(total);
        }

        function openCheckout() {
            if (Object.keys(cart).length === 0) return;
            document.getElementById('checkout-modal').classList.remove('hidden');
            document.body.classList.add('modal-open');
            setTimeout(() => {
                document.getElementById('modal-content').classList.remove('translate-y-full');
            }, 10);
        }

        function closeCheckout() {
            document.getElementById('modal-content').classList.add('translate-y-full');
            setTimeout(() => {
                document.getElementById('checkout-modal').classList.add('hidden');
                document.body.classList.remove('modal-open');
                turnstileToken = '';
                document.getElementById('btn-submit').disabled = true;
                if (window.turnstile) window.turnstile.reset();
            }, 300);
        }

        document.querySelectorAll('input[name="payment"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                const qrisSection = document.getElementById('qris-section');
                if (e.target.value === 'qris') {
                    if (!storeQrisUrl) alert('QRIS belum diatur oleh pemilik toko.');
                    qrisSection.classList.remove('hidden');
                } else {
                    qrisSection.classList.add('hidden');
                }
            });
        });

        async function submitOrder() {
            if (!turnstileToken) {
                alert('Silakan selesaikan verifikasi keamanan terlebih dahulu.');
                return;
            }

            const btn = document.getElementById('btn-submit');
            btn.disabled = true;
            btn.innerText = 'Mengirim...';

            // Token Turnstile hanya berlaku sekali.
            const tokenUsed = turnstileToken;
            turnstileToken = '';

            try {
                const paymentMethod = document.querySelector('input[name="payment"]:checked').value;
                const orderType = document.querySelector('input[name="order_type"]:checked').value;
                const orderNote = document.getElementById('order-note').value.trim();

                if (orderType === 'delivery' && orderNote === '') {
                    alert('Mohon isi alamat lengkap Anda di kolom Catatan untuk pesanan Antar/Deliv.');
                    return;
                }

                const itemsArray = Object.keys(cart).map(id => ({
                    product_id: id,
                    qty: cart[id].qty
                }));

                if (itemsArray.length === 0) {
                    alert('Keranjang kosong.');
                    return;
                }

                // Harga dan total dihitung ulang di server. Browser hanya mengirim product_id dan qty.
                const res = await fetch(CREATE_ORDER_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_ANON_KEY
                    },
                    body: JSON.stringify({
                        store_id: STORE_ID,
                        items: itemsArray,
                        tipe_pesanan: orderType,
                        metode_pembayaran: paymentMethod,
                        catatan: orderNote || null,
                        turnstile_token: tokenUsed
                    })
                });

                let result = {};
                try { result = await res.json(); } catch {}

                if (!res.ok) throw new Error(result.error || 'Gagal memproses pesanan');

                alert(paymentMethod === 'qris'
                    ? 'Pesanan diterima!\n\nSilakan scan dan bayar QRIS di meja kasir.'
                    : 'Pesanan diterima!\n\nSilakan menuju meja kasir untuk membayar tunai.');

                cart = {};
                document.getElementById('order-note').value = '';
                await fetchProducts();
                updateCartUI();
                closeCheckout();
            } catch (err) {
                alert(err.message || 'Gagal mengirim pesanan. Pastikan koneksi internet stabil.');
            } finally {
                btn.innerText = 'Kirim ke Kasir';
                btn.disabled = true;
                if (window.turnstile) window.turnstile.reset();
            }
        }

        window.onload = async () => {
            if (!STORE_ID) {
                showErrorPage('403', 'Akses Ditolak', 'Link toko tidak valid.');
                return;
            }
            try {
                await fetchStoreInfo();
                await fetchProducts();
            } catch (err) {
                console.warn('Proses dihentikan.');
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        };
    </script>
</body>
</html>
