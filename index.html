<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Toko</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Script Cloudflare Turnstile -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        body.modal-open { overflow: hidden; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        .skeleton { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; background-color: #e5e7eb; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800 font-sans">

    <div id="error-page" class="hidden fixed inset-0 bg-white z-50 flex flex-col items-center justify-center p-6 text-center">
        <h1 class="text-6xl font-bold text-gray-300 mb-4" id="error-code">404</h1>
        <h2 class="text-2xl font-bold text-gray-700 mb-2" id="error-title">Halaman Tidak Ditemukan</h2>
        <p class="text-gray-500 mb-6" id="error-desc">Maaf, link yang Anda akses tidak valid atau toko tidak ditemukan.</p>
        <button onclick="window.location.reload()" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-semibold">Muat Ulang</button>
    </div>

    <header class="bg-white shadow-sm sticky top-0 z-10">
        <div class="max-w-md mx-auto px-4 py-4 flex justify-between items-center">
            <h1 id="store-name" class="text-xl font-bold text-blue-600">Memuat Toko...</h1>
            <div class="relative">
                <span class="text-2xl">🛒</span>
                <span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-bold px-2 py-0.5 rounded-full hidden">0</span>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 pb-24">
        <div id="loading" class="space-y-4">
            <div class="h-20 rounded-xl skeleton"></div>
            <div class="h-20 rounded-xl skeleton"></div>
            <div class="h-20 rounded-xl skeleton"></div>
        </div>
        
        <div id="error-msg" class="hidden bg-red-100 text-red-700 p-4 rounded-lg mb-4 text-center"></div>
        
        <div id="product-list" class="grid grid-cols-1 gap-3 hidden"></div>
    </main>

    <div id="floating-cart" class="fixed bottom-0 left-0 right-0 p-4 bg-white border-t border-gray-200 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] transform translate-y-full transition-transform duration-300 z-20">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <p class="text-sm text-gray-500">Total Belanja</p>
                <p id="cart-total" class="text-xl font-bold text-gray-900">Rp 0</p>
            </div>
            <button onclick="openCheckout()" class="bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-700 transition shadow-md">
                Pesan Sekarang
            </button>
        </div>
    </div>

    <div id="checkout-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-end justify-center">
        <div class="bg-white w-full max-w-md rounded-t-2xl p-6 transform transition-transform duration-300 translate-y-full" id="modal-content">
            <h2 class="text-xl font-bold mb-4 text-gray-800">Konfirmasi Pesanan</h2>
            
            <label class="block text-sm font-semibold mb-1 text-gray-700">Catatan (Opsional):</label>
            <textarea id="order-note" rows="2" class="w-full border border-gray-300 rounded-lg p-2 mb-4 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Contoh: Tanpa es, pedas sedang..."></textarea>

            <p class="text-sm font-semibold mb-3 text-gray-700">Pilih Metode Pembayaran:</p>
            <div class="flex gap-3 mb-6">
                <label class="flex-1 flex items-center justify-center p-3 border border-gray-300 rounded-lg cursor-pointer hover:bg-blue-50 transition has-[:checked]:border-blue-600 has-[:checked]:bg-blue-50">
                    <input type="radio" name="payment" value="tunai" class="mr-2 accent-blue-600" checked>
                    <span class="text-sm font-medium">Tunai</span>
                </label>
                <label class="flex-1 flex items-center justify-center p-3 border border-gray-300 rounded-lg cursor-pointer hover:bg-blue-50 transition has-[:checked]:border-blue-600 has-[:checked]:bg-blue-50">
                    <input type="radio" name="payment" value="qris" class="mr-2 accent-blue-600">
                    <span class="text-sm font-medium">QRIS</span>
                </label>
            </div>

            <div id="qris-section" class="hidden mb-4 text-center">
                <p class="text-xs text-gray-500 mb-1">Scan QRIS di bawah ini:</p>
                <img id="qris-image" src="" alt="QRIS" class="mx-auto w-40 h-40 object-contain border rounded-lg shadow-sm">
            </div>

            <!-- Container Cloudflare Turnstile -->
            <div class="cf-turnstile mb-4 flex justify-center" data-sitekey="0x4AAAAAAFtgRHOwM3ep1Ln9" data-callback="onTurnstileSuccess"></div>

            <div class="flex gap-3">
                <button onclick="closeCheckout()" class="flex-1 bg-gray-100 text-gray-700 py-3 rounded-lg font-semibold hover:bg-gray-200 transition">Batal</button>
                <button id="btn-submit" onclick="submitOrder()" class="flex-1 bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700 transition shadow-md disabled:bg-gray-400 disabled:cursor-not-allowed" disabled>Kirim ke Kasir</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://zvpbdbzcvahtowpxjraw.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_5OvXNZ_cqui9sofwe1RytA__VSZ0PN9';
        
        const TURNSTILE_SITE_KEY = '0x4AAAAAAFtgRHOwM3ep1Ln9'; 

        const urlParams = new URLSearchParams(window.location.search);
        const rawStoreId = urlParams.get('store') || '';
        
        const storeIdRegex = /^STORE-[A-Z0-9]{6,8}$/i;
        const STORE_ID = storeIdRegex.test(rawStoreId) ? rawStoreId : '';

        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let products = [];
        let cart = {}; 
        let storeQrisUrl = '';
        let turnstileToken = '';

        window.onTurnstileSuccess = function(token) {
            turnstileToken = token;
            document.getElementById('btn-submit').disabled = false;
        };

        function showErrorPage(code, title, desc) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('error-code').innerText = code;
            document.getElementById('error-title').innerText = title;
            document.getElementById('error-desc').textContent = desc; 
            document.getElementById('error-page').classList.remove('hidden');
            document.getElementById('product-list').style.display = 'none';
            document.getElementById('floating-cart').style.display = 'none';
        }

        async function fetchStoreName() {
            try {
                const { data, error } = await db
                    .from('profiles')
                    .select('store_name, qris_url')
                    .eq('store_id', STORE_ID)
                    .single();

                if (error || !data) {
                    throw new Error("Not Found");
                }

                document.getElementById('store-name').innerText = data.store_name;
                document.title = data.store_name + " - Menu"; 
                if (data.qris_url) {
                    storeQrisUrl = data.qris_url;
                    document.getElementById('qris-image').src = storeQrisUrl;
                }
            } catch (err) {
                showErrorPage("404", "Toko Tidak Ditemukan", "Toko tidak terdaftar atau telah dinonaktifkan.");
                throw err; 
            }
        }

        async function fetchProducts() {
            try {
                const { data, error } = await db
                    .from('products')
                    .select('id, name, price, stock, category')
                    .eq('store_id', STORE_ID)
                    .gt('stock', 0); 

                if (error) throw error;
                
                products = data;
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('product-list').classList.remove('hidden');
                renderProducts();
            } catch (err) {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('error-msg').classList.remove('hidden');
                document.getElementById('error-msg').innerText = 'Terjadi kesalahan sistem. Silakan coba lagi nanti.';
            }
        }
        
        function renderProducts() {
            const container = document.getElementById('product-list');
            container.innerHTML = '';

            if(products.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-500 py-10">Belum ada produk tersedia saat ini.</p>';
                return;
            }

            products.forEach(p => {
                const qty = cart[p.id] ? cart[p.id].qty : 0;
                
                const card = document.createElement('div');
                card.className = 'bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center';
                card.innerHTML = `
                    <div class="flex-1">
                        <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">${p.category}</span>
                        <h3 class="font-bold text-lg text-gray-800">${p.name}</h3>
                        <p class="text-blue-600 font-semibold mb-1">Rp ${p.price.toLocaleString('id-ID')}</p>
                        <p class="text-xs text-gray-500">Sisa Stok: ${p.stock}</p>
                    </div>
                    <div class="flex items-center gap-3 ml-4">
                        ${qty > 0 ? `
                            <button onclick="updateQty('${p.id}', -1)" class="w-8 h-8 rounded-full bg-red-50 text-red-600 font-bold border border-red-100 flex items-center justify-center hover:bg-red-100 transition">-</button>
                            <span class="font-bold w-4 text-center">${qty}</span>
                        ` : ''}
                        <button onclick="updateQty('${p.id}', 1)" class="w-8 h-8 rounded-full bg-blue-50 text-blue-600 font-bold border border-blue-100 flex items-center justify-center hover:bg-blue-100 transition">+</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function updateQty(productId, change) {
            const product = products.find(p => p.id === productId);
            if (!product) return;

            if (!cart[productId]) {
                cart[productId] = { qty: 0, data: product };
            }

            const currentQty = cart[productId].qty;
            const newQty = currentQty + change;

            if (newQty < 0) return;
            
            if (newQty > product.stock) {
                alert('Maaf, stok tidak mencukupi!');
                return;
            }

            if (newQty === 0) {
                delete cart[productId]; 
            } else {
                cart[productId].qty = newQty;
            }

            renderProducts(); 
            updateCartUI();   
        }
        
        function updateCartUI() {
            let total = 0;
            let totalItems = 0;

            for (const key in cart) {
                total += cart[key].data.price * cart[key].qty;
                totalItems += cart[key].qty;
            }

            const countBadge = document.getElementById('cart-count');
            const floatingCart = document.getElementById('floating-cart');

            if (totalItems > 0) {
                countBadge.classList.remove('hidden');
                countBadge.innerText = totalItems;
                floatingCart.classList.remove('translate-y-full'); 
            } else {
                countBadge.classList.add('hidden');
                floatingCart.classList.add('translate-y-full'); 
            }

            document.getElementById('cart-total').innerText = 'Rp ' + total.toLocaleString('id-ID');
        }

        function openCheckout() {
            if (Object.keys(cart).length === 0) return;
            document.getElementById('checkout-modal').classList.remove('hidden');
            document.body.classList.add('modal-open');
            setTimeout(() => {
                document.getElementById('modal-content').classList.remove('translate-y-full');
            }, 10);
        }

        function closeCheckout() {
            document.getElementById('modal-content').classList.add('translate-y-full');
            setTimeout(() => {
                document.getElementById('checkout-modal').classList.add('hidden');
                document.body.classList.remove('modal-open');
                turnstileToken = '';
                document.getElementById('btn-submit').disabled = true;
                if (window.turnstile) {
                    window.turnstile.reset();
                }
            }, 300);
        }

        document.querySelectorAll('input[name="payment"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                const qrisSection = document.getElementById('qris-section');
                if (e.target.value === 'qris') {
                    if (!storeQrisUrl) {
                        alert("QRIS belum diatur oleh Admin.");
                    }
                    qrisSection.classList.remove('hidden');
                } else {
                    qrisSection.classList.add('hidden');
                }
            });
        });

        async function submitOrder() {
            if (!turnstileToken) {
                alert('Silakan selesaikan verifikasi keamanan (Captcha) terlebih dahulu.');
                return;
            }

            const btn = document.getElementById('btn-submit');
            btn.disabled = true;
            btn.innerText = 'Mengirim...';

            try {
                const paymentMethod = document.querySelector('input[name="payment"]:checked').value;
                const orderNote = document.getElementById('order-note').value.trim();
                
                const itemsArray = Object.keys(cart).map(id => ({
                    product_id: id,
                    name: cart[id].data.name,
                    price: cart[id].data.price,
                    qty: cart[id].qty,
                    subtotal: cart[id].data.price * cart[id].qty
                }));

                let total = 0;
                itemsArray.forEach(i => total += i.subtotal);

                const trxId = 'TRX-' + Date.now() + '-' + Math.floor(Math.random() * 1000);

                const { error } = await db
                    .from('transactions')
                    .insert([{
                        id: trxId,
                        store_id: STORE_ID,
                        total_amount: total,
                        metode_pembayaran: paymentMethod,
                        status: 'pending',
                        items: itemsArray,
                        catatan: orderNote || null
                    }]);

                if (error) throw error;

                if (paymentMethod === 'qris') {
                    alert("Pesanan diterima!\n\nSilakan scan dan bayar QRIS, lalu kirim bukti transfer via WhatsApp ke Admin.");
                } else {
                    alert("Pesanan diterima!\n\nSilakan menuju ke meja kasir untuk melakukan pembayaran Tunai.");
                }

                cart = {};
                document.getElementById('order-note').value = '';
                renderProducts();
                updateCartUI();
                closeCheckout();

            } catch (err) {
                alert('Gagal mengirim pesanan. Pastikan koneksi internet stabil.');
            } finally {
                if (document.getElementById('checkout-modal').classList.contains('hidden')) {
                    btn.innerText = 'Kirim ke Kasir';
                } else {
                    btn.innerText = 'Kirim ke Kasir';
                }
            }
        }

        window.onload = async () => {
            try {
                if (!STORE_ID) {
                    throw new Error("Invalid Store ID Format");
                }
                await fetchStoreName();
                await fetchProducts();
            } catch (err) {
                console.warn("Proses dihentikan oleh sistem keamanan atau data tidak ditemukan.");
                if (!document.getElementById('error-page').classList.contains('hidden')) {
                } else {
                    showErrorPage("403", "Akses Ditolak", "Ngapain?");
                }
            } finally {
                const loadingEl = document.getElementById('loading');
                if (loadingEl) loadingEl.classList.add('hidden');
            }
        };
    </script>
</body>
</html>
