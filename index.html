<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Toko</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body.modal-open { overflow: hidden; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        .skeleton { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; background-color: #e5e7eb; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800 font-sans">

    <header class="bg-white shadow-sm sticky top-0 z-10">
        <div class="max-w-md mx-auto px-4 py-4 flex justify-between items-center">
            <h1 id="store-name" class="text-xl font-bold text-blue-600">Memuat Toko...</h1>
            <div class="relative">
                <span class="text-2xl">🛒</span>
                <span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-bold px-2 py-0.5 rounded-full hidden">0</span>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 pb-24">
        <div id="loading" class="space-y-4">
            <div class="h-20 rounded-xl skeleton"></div>
            <div class="h-20 rounded-xl skeleton"></div>
            <div class="h-20 rounded-xl skeleton"></div>
        </div>
        
        <div id="error-msg" class="hidden bg-red-100 text-red-700 p-4 rounded-lg mb-4 text-center"></div>
        
        <div id="product-list" class="grid grid-cols-1 gap-3 hidden"></div>
    </main>

    <div id="floating-cart" class="fixed bottom-0 left-0 right-0 p-4 bg-white border-t border-gray-200 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] transform translate-y-full transition-transform duration-300 z-20">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <p class="text-sm text-gray-500">Total Belanja</p>
                <p id="cart-total" class="text-xl font-bold text-gray-900">Rp 0</p>
            </div>
            <button onclick="openCheckout()" class="bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-700 transition shadow-md">
                Pesan Sekarang
            </button>
        </div>
    </div>

    <div id="checkout-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-end justify-center">
        <div class="bg-white w-full max-w-md rounded-t-2xl p-6 transform transition-transform duration-300 translate-y-full" id="modal-content">
            <h2 class="text-xl font-bold mb-4 text-gray-800">Konfirmasi Pesanan</h2>
            <p class="text-sm font-semibold mb-3 text-gray-700">Pilih Metode Pembayaran:</p>
            <div class="flex gap-3 mb-6">
                <label class="flex-1 flex items-center justify-center p-3 border border-gray-300 rounded-lg cursor-pointer hover:bg-blue-50 transition has-[:checked]:border-blue-600 has-[:checked]:bg-blue-50">
                    <input type="radio" name="payment" value="tunai" class="mr-2 accent-blue-600" checked>
                    <span class="text-sm font-medium">Tunai</span>
                </label>
                <label class="flex-1 flex items-center justify-center p-3 border border-gray-300 rounded-lg cursor-pointer hover:bg-blue-50 transition has-[:checked]:border-blue-600 has-[:checked]:bg-blue-50">
                    <input type="radio" name="payment" value="qris" class="mr-2 accent-blue-600">
                    <span class="text-sm font-medium">QRIS</span>
                </label>
            </div>

            <p id="qris-note" class="hidden text-xs text-orange-600 bg-orange-50 p-3 rounded-lg mb-4">
                *Setelah menekan pesan, silakan bayar via QRIS di kasir dan kirim bukti transfer ke WhatsApp Admin.
            </p>

            <div class="flex gap-3">
                <button onclick="closeCheckout()" class="flex-1 bg-gray-100 text-gray-700 py-3 rounded-lg font-semibold hover:bg-gray-200 transition">Batal</button>
                <button id="btn-submit" onclick="submitOrder()" class="flex-1 bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700 transition shadow-md">Kirim ke Kasir</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://zvpbdbzcvahtowpxjraw.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_5OvXNZ_cqui9sofwe1RytA__VSZ0PN9';

        const urlParams = new URLSearchParams(window.location.search);
        const STORE_ID = urlParams.get('store') || 'STORE-DEFAULT';

        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let products = [];
        let cart = {}; 
        
        async function fetchStoreName() {
            try {
                const { data, error } = await db
                    .from('profiles')
                    .select('store_name')
                    .eq('store_id', STORE_ID)
                    .single();

                if (data && data.store_name) {
                    document.getElementById('store-name').innerText = data.store_name;
                    document.title = data.store_name + " - Menu"; 
                } else {
                    document.getElementById('store-name').innerText = "Toko Tidak Ditemukan";
                }
            } catch (err) {
                document.getElementById('store-name').innerText = "Toko Kami";
            }
        }

        async function fetchProducts() {
            try {
                const { data, error } = await db
                    .from('products')
                    .select('id, name, price, stock, category')
                    .eq('store_id', STORE_ID)
                    .gt('stock', 0); 

                if (error) throw error;
                
                products = data;
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('product-list').classList.remove('hidden');
                renderProducts();
            } catch (err) {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('error-msg').classList.remove('hidden');
                document.getElementById('error-msg').innerText = 'Gagal memuat menu: ' + err.message;
            }
        }
        
        function renderProducts() {
            const container = document.getElementById('product-list');
            container.innerHTML = '';

            if(products.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-500 py-10">Belum ada produk tersedia saat ini.</p>';
                return;
            }

            products.forEach(p => {
                const qty = cart[p.id] ? cart[p.id].qty : 0;
                
                const card = document.createElement('div');
                card.className = 'bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center';
                card.innerHTML = `
                    <div class="flex-1">
                        <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">${p.category}</span>
                        <h3 class="font-bold text-lg text-gray-800">${p.name}</h3>
                        <p class="text-blue-600 font-semibold mb-1">Rp ${p.price.toLocaleString('id-ID')}</p>
                        <p class="text-xs text-gray-500">Sisa Stok: ${p.stock}</p>
                    </div>
                    <div class="flex items-center gap-3 ml-4">
                        ${qty > 0 ? `
                            <button onclick="updateQty('${p.id}', -1)" class="w-8 h-8 rounded-full bg-red-50 text-red-600 font-bold border border-red-100 flex items-center justify-center hover:bg-red-100 transition">-</button>
                            <span class="font-bold w-4 text-center">${qty}</span>
                        ` : ''}
                        <button onclick="updateQty('${p.id}', 1)" class="w-8 h-8 rounded-full bg-blue-50 text-blue-600 font-bold border border-blue-100 flex items-center justify-center hover:bg-blue-100 transition">+</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function updateQty(productId, change) {
            const product = products.find(p => p.id === productId);
            if (!product) return;

            if (!cart[productId]) {
                cart[productId] = { qty: 0, data: product };
            }

            const currentQty = cart[productId].qty;
            const newQty = currentQty + change;

            if (newQty < 0) return;
            
            if (newQty > product.stock) {
                alert('Maaf, stok tidak mencukupi!');
                return;
            }

            if (newQty === 0) {
                delete cart[productId]; 
            } else {
                cart[productId].qty = newQty;
            }

            renderProducts(); 
            updateCartUI();   
        }
        
        function updateCartUI() {
            let total = 0;
            let totalItems = 0;

            for (const key in cart) {
                total += cart[key].data.price * cart[key].qty;
                totalItems += cart[key].qty;
            }

            const countBadge = document.getElementById('cart-count');
            const floatingCart = document.getElementById('floating-cart');

            if (totalItems > 0) {
                countBadge.classList.remove('hidden');
                countBadge.innerText = totalItems;
                floatingCart.classList.remove('translate-y-full'); 
            } else {
                countBadge.classList.add('hidden');
                floatingCart.classList.add('translate-y-full'); 
            }

            document.getElementById('cart-total').innerText = 'Rp ' + total.toLocaleString('id-ID');
        }

        function openCheckout() {
            if (Object.keys(cart).length === 0) return;
            document.getElementById('checkout-modal').classList.remove('hidden');
            document.body.classList.add('modal-open');
            setTimeout(() => {
                document.getElementById('modal-content').classList.remove('translate-y-full');
            }, 10);
        }

        function closeCheckout() {
            document.getElementById('modal-content').classList.add('translate-y-full');
            setTimeout(() => {
                document.getElementById('checkout-modal').classList.add('hidden');
                document.body.classList.remove('modal-open');
            }, 300);
        }

        document.querySelectorAll('input[name="payment"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                const qrisNote = document.getElementById('qris-note');
                if (e.target.value === 'qris') {
                    qrisNote.classList.remove('hidden');
                } else {
                    qrisNote.classList.add('hidden');
                }
            });
        });

        async function submitOrder() {
            const btn = document.getElementById('btn-submit');
            btn.disabled = true;
            btn.innerText = 'Mengirim...';

            try {
                const paymentMethod = document.querySelector('input[name="payment"]:checked').value;
                
                const itemsArray = Object.keys(cart).map(id => ({
                    product_id: id,
                    name: cart[id].data.name,
                    price: cart[id].data.price,
                    qty: cart[id].qty,
                    subtotal: cart[id].data.price * cart[id].qty
                }));

                let total = 0;
                itemsArray.forEach(i => total += i.subtotal);

                const trxId = 'TRX-' + Date.now() + '-' + Math.floor(Math.random() * 1000);

                const { error } = await db
                    .from('transactions')
                    .insert([{
                        id: trxId,
                        store_id: STORE_ID,
                        total_amount: total,
                        metode_pembayaran: paymentMethod,
                        status: 'pending',
                        items: itemsArray
                    }]);

                if (error) throw error;

                if (paymentMethod === 'qris') {
                    alert("Pesanan diterima!\n\nSilakan lakukan pembayaran QRIS di meja kasir, lalu kirim bukti transfer via WhatsApp ke Admin.");
                } else {
                    alert("Pesanan diterima!\n\nSilakan menuju ke meja kasir untuk melakukan pembayaran Tunai.");
                }

                cart = {};
                renderProducts();
                updateCartUI();
                closeCheckout();

            } catch (err) {
                alert('Gagal mengirim pesanan: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = 'Kirim ke Kasir';
            }
        }

        window.onload = () => {
            if (STORE_ID === 'STORE-DEFAULT') {
                document.getElementById('error-msg').classList.remove('hidden');
                document.getElementById('error-msg').innerText = 'Error: Parameter toko tidak ditemukan di URL.';
                document.getElementById('loading').classList.add('hidden');
                return;
            }
            fetchStoreName();
            fetchProducts();
        };
    </script>
</body>
</html>
