<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
    <title>Verifikasi Email - GenPOS</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 40px 20px; background: #f4f6f8; color: #333; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
        h2 { color: #2563eb; margin-top: 0; }
        h2.error { color: #dc2626; }
        p { color: #64748b; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="card">
        <h2 id="title">Email Berhasil Diverifikasi!</h2>
        <p id="desc">Akun GenPOS Anda sudah aktif. Silakan kembali ke aplikasi dan login.</p>
    </div>

    <script>
        (function () {
            // Supabase menambahkan parameter error bila link kedaluwarsa atau sudah dipakai.
            var raw = window.location.search + window.location.hash;
            if (/error(_code|_description)?=/.test(raw)) {
                document.getElementById('title').textContent = 'Link Tidak Berlaku';
                document.getElementById('title').className = 'error';
                document.getElementById('desc').textContent = 'Link verifikasi sudah kedaluwarsa atau sudah pernah dipakai. Silakan minta ulang email verifikasi dari aplikasi.';
            }
            // Bersihkan parameter dari alamat agar token tidak tersimpan di riwayat browser.
            history.replaceState(null, '', window.location.pathname);
        })();
    </script>
</body>
</html>
