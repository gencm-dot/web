<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Verifikasi Berhasil - GenPOS</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 40px 20px; background: #f4f6f8; color: #333; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
        h2 { color: #2563eb; margin-top: 0; }
        p { color: #64748b; line-height: 1.5; }
        .btn { background: #2563eb; color: white; padding: 14px 28px; text-decoration: none; border-radius: 8px; font-weight: bold; display: inline-block; margin-top: 20px; box-shadow: 0 2px 5px rgba(37,99,235,0.3); }
    </style>
</head>
<body>
    <div class="card">
        <h2 id="main-title">Email Berhasil Diverifikasi!</h2>
        <p id="main-desc">Akun GenPOS Anda telah aktif di server. Silakan ketuk tombol di bawah ini untuk kembali dan masuk ke dalam aplikasi.</p>
        <a id="open-app-btn" href="#" class="btn">Buka Aplikasi GenPOS</a>
    </div>

    <script>
        const hashParams = window.location.hash || '';
        const queryParams = window.location.search || '';
        
        let rawParams = queryParams + hashParams;
        let decodedParams = "";
        try {
            decodedParams = decodeURIComponent(rawParams);
        } catch(e) {
            decodedParams = rawParams;
        }

        const sanitizedParams = decodedParams.replace(/[^a-zA-Z0-9\-._~:/?#\[\]@!$&*+,=%]/g, '');

        let deepLinkUrl = "genpos://login-callback";
        let isValid = true;

        if (sanitizedParams.length > 0) {
            deepLinkUrl += sanitizedParams;
        } else {
            isValid = false;
        }

        const btn = document.getElementById('open-app-btn');

        if (isValid) {
            btn.setAttribute('href', deepLinkUrl);
            setTimeout(function() {
                window.location.href = deepLinkUrl;
            }, 600);
        } else {
            document.getElementById('main-title').innerText = "Link Tidak Valid";
            document.getElementById('main-desc').innerText = "Parameter pada link ini tidak ditemukan atau tidak aman. Silakan minta ulang email verifikasi.";
            btn.style.display = 'none';
        }
    </script>
</body>
</html>
